services:
  # Throwaway database for `cargo test` and sqlx compile-time query checks.
  # Start with: docker compose --profile test up -d db-test
  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 2s
      timeout: 3s
      retries: 15
